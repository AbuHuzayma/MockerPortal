apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-api
  labels:
    app.kubernetes.io/name: portal-api
    app.kubernetes.io/part-of: mockerportal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-api
        app.kubernetes.io/part-of: mockerportal
    spec:
      # No runAsUser/fsGroup — OpenShift's restricted SCC assigns one from
      # the namespace's allocated UID range at admission.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal-api
          # Placeholder — set per environment via `kustomize edit set image`
          # in the GitLab CI deploy job (.gitlab-ci.yml), never hardcoded here.
          image: portal-api:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: portal-api-config
            - secretRef:
                name: portal-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # ASP.NET Core Data Protection keys need a writable dir; revisit if that moves to a mounted volume.
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            # Starting point for an internal QA tool's traffic — tune from
            # real usage once observed, not a load-tested figure.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
