# NOT applied by kustomization.yaml and never committed with real values —
# this documents the Secret ops must provision out-of-band per namespace
# (`oc create secret generic ...`, a sealed-secret, or the enterprise
# secret store once confirmed — docs/13-deployment.md §4/§7). Mirrors
# .env.example's naming exactly; see that file for what each key is for.
apiVersion: v1
kind: Secret
metadata:
  name: portal-api-secrets
  labels:
    app.kubernetes.io/name: portal-api
    app.kubernetes.io/part-of: mockerportal
type: Opaque
stringData:
  ConnectionStrings__PortalDb: "REPLACE_ME"
  Jwt__SigningKey: "REPLACE_ME"
  # Only required where the matching Providers:*:Mode (appsettings.{Env}.json)
  # is "Sql" or "Real" — omit keys this environment's providers don't use.
  ConnectionStrings__CustomerDatabase: "REPLACE_ME"
  ConnectionStrings__MerchantDatabase: "REPLACE_ME"
  Integrations__CardManagement__BaseUrl: "REPLACE_ME"
  Integrations__BeneficiaryService__BaseUrl: "REPLACE_ME"
  Integrations__B2BService__BaseUrl: "REPLACE_ME"
