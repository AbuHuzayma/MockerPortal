server {
    # nginxinc/nginx-unprivileged already listens on 8080 by default — see
    # Dockerfile. Kept explicit here for clarity.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # env-config.js is regenerated per container start (docker-entrypoint.d) —
    # never cache it, unlike the fingerprinted JS/CSS bundle below.
    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — client-side routing (react-router) owns everything else.
    location / {
        try_files $uri /index.html;
    }
}
